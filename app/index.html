<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Status - Local Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-slate-800 rounded-xl shadow-2xl overflow-hidden border border-slate-700">
    <div class="bg-amber-500 text-slate-950 font-bold px-6 py-4 text-center tracking-wide uppercase">
      Environment: LOCAL
    </div>
    <div class="p-6 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <span class="text-slate-400 text-sm">Application Version</span>
        <span class="font-mono text-sm bg-slate-700 px-2.5 py-1 rounded">v1.0.0</span>
      </div>
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <span class="text-slate-400 text-sm">Jenkins Build #</span>
        <span class="font-mono text-sm bg-slate-700 px-2.5 py-1 rounded">#0</span>
      </div>
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <span class="text-slate-400 text-sm">Host System</span>
        <span class="font-mono text-sm text-slate-300">local-preview</span>
      </div>
      <div class="flex justify-between items-center pt-2">
        <span class="text-slate-400 text-sm">Health Check</span>
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> 200 OK
        </span>
      </div>
    </div>
  </div>
</body>
</html>
